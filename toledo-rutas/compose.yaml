services:
  wordpress:
    image: wordpress:6.8-apache
    container_name: toledo-rutas-wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: toledorutas
      WORDPRESS_DB_USER: rutasuser
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definida}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress:/var/www/html/wp-content/plugins/toledo-rutas
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rutas_net

  db:
    image: mariadb:11.4
    container_name: toledo-rutas-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: toledorutas
      MARIADB_USER: rutasuser
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no definida}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD no definida}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rutas_net

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    container_name: toledo-rutas-osrm-car
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/castilla-la-mancha-latest.osrm
    networks:
      - rutas_net

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    container_name: toledo-rutas-osrm-bike
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/castilla-la-mancha-bike.osrm
    networks:
      - rutas_net

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    container_name: toledo-rutas-osrm-foot
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/castilla-la-mancha-foot.osrm
    networks:
      - rutas_net

volumes:
  wordpress_data:
  db_data:

networks:
  rutas_net:
    driver: bridge